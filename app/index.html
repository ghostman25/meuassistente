function recurrenceOccurrences(start,end){let out=[];db.recurring.forEach(r=>{if(r.active===false)return;let d=new Date((r.start||start)+'T12:00:00'),limit=r.end?new Date(r.end+'T12:00:00'):new Date(end+'T12:00:00'),safety=0;while(d<=limit&&safety<500){let ds=d.toISOString().slice(0,10);if(ds>=start&&ds<=end)out.push({id:r.id+'@'+ds,type:r.type,category:r.category,desc:r.desc,amount:Number(r.amount),date:ds,note:r.note||'',auto:true,recurrenceId:r.id,accountId:r.accountId||'',status:'pending'});if(r.frequency==='weekly')d.setDate(d.getDate()+7);else if(r.frequency==='yearly')d.setFullYear(d.getFullYear()+1);else d.setMonth(d.getMonth()+1);safety++}});return out}
function allEntries(start='1900-01-01',end='2099-12-31'){let raw=[...db.entries,...debtEntries(),...recurrenceOccurrences(start,end)],seen=new Set();return raw.filter(x=>{let k=x.id+'|'+x.date+'|'+x.type+'|'+x.amount;if(seen.has(k))return false;seen.add(k);return true})}
function migrateLegacyAssistantData(){if(localStorage.getItem('ma_legacy_fix_11')==='1')return;let changed=false;let food=/almo[cç]o|jantar|lanche|cafe|café|refei[cç][aã]o|comida/i;db.debts=(db.debts||[]).filter(d=>{if(food.test(String(d.name||''))){let total=Number(d.total||0),id=Date.now().toString()+'-legacy';if(total>0){db.entries.push({id,type:'expense',category:'Alimentação',desc:String(d.name||'Despesa'),amount:total,date:d.start||todayISO(),status:'paid',note:'Corrigido automaticamente pelo Meu Assistente'});changed=true;return false}}return true});localStorage.setItem('ma_legacy_fix_11','1');if(changed)save()}
function sums(items){let s={income:0,expense:0,debt:0,investment:0};items.forEach(x=>{if(!isPaid(x))return;s[x.type]=(s[x.type]||0)+Number(x.amount||0)});return s}
function plannedSums(items){let s={income:0,expense:0,debt:0,investment:0};items.forEach(x=>{if(isPaid(x))return;s[x.type]=(s[x.type]||0)+Number(x.amount||0)});return s}
function monthBounds(m){let [y,mo]=m.split('-').map(Number);return {start:`${m}-01`,end:new Date(y,mo,0).toISOString().slice(0,10)}}
function forecast(m){let b=monthBounds(m),all=allEntries(b.start,b.end),actual=sums(all.filter(x=>x.date<=todayISO())),future=plannedSums(all.filter(x=>x.date>todayISO())),pendingPast=plannedSums(all.filter(x=>x.date<=todayISO()));let saldoAtual=actual.income-actual.expense-actual.debt-actual.investment;let saldoPrevisto=(actual.income+future.income+pendingPast.income)-(actual.expense+future.expense+pendingPast.expense+actual.debt+future.debt+pendingPast.debt+actual.investment+future.investment+pendingPast.investment);return {actual,future,pendingPast,saldoAtual,saldoPrevisto,total: {...actual}}}
function upcomingPayments(m){let b=monthBounds(m),now=todayISO();return allEntries(b.start,b.end).filter(x=>!isPaid(x)&&x.type!=='income').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10)}
function alertData(m){let out=[],f=forecast(m),now=todayISO();categories.expense.forEach(c=>{let items=allEntries(monthBounds(m).start,monthBounds(m).end).filter(x=>x.type==='expense'&&x.category===c),spent=sums(items).expense,limit=Number(db.budgets[m+'|'+c]||0);if(limit&&spent>limit)out.push({level:'danger',title:'Orçamento ultrapassado',text:`${c}: ${money(spent)} de ${money(limit)}.`});else if(limit&&spent>=limit*.8)out.push({level:'warning',title:'Orçamento chegando ao limite',text:`${c}: ${Math.round(spent/limit*100)}% utilizado.`})});if(f.saldoPrevisto<0)out.push({level:'danger',title:'Saldo previsto negativo',text:`A previsão de fechamento é ${money(f.saldoPrevisto)}.`});let next=upcomingPayments(m)[0];if(next){let days=Math.ceil((new Date(next.date+'T12:00:00')-new Date(now+'T12:00:00'))/86400000);if(days<=3)out.push({level:'warning',title:days<0?'Pagamento atrasado':'Pagamento próximo',text:`${next.desc} ${days<0?'está atrasado':'vence '+(days===0?'hoje':'em '+days+' dia(s)')} — ${money(next.amount)}.`})}return out}
function nav(){let arr=[['dashboard','Visão geral'],['entries','Lançamentos'],['recurring','Recorrências'],['debts','Parcelas'],['budgets','Orçamentos'],['assets','Patrimônio'],['goals','Metas'],['reports','Relatórios'],['annual','Visão anual'],['alerts','🔔 Alertas']];document.getElementById('nav').innerHTML=arr.map(([v,t])=>`<button class="${view===v?'active':''}" onclick="view='${v}';render()">${t}</button>`).join('')}
function monthBar(){return `<div class="monthbar"><button class="iconbtn" onclick="cursor.setMonth(cursor.getMonth()-1);render()">‹</button><div style="text-align:center"><h1>${monthLabel(cursor)}</h1><div class="sub">Visão financeira do mês selecionado</div></div><button class="iconbtn" onclick="cursor.setMonth(cursor.getMonth()+1);render()">›</button></div>`}
function dashboard(){let m=ym(cursor),f=forecast(m),alerts=alertData(m),payments=upcomingPayments(m),days=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate(),now=new Date(),progress=cursor.getFullYear()===now.getFullYear()&&cursor.getMonth()===now.getMonth()?now.getDate()/days*100:100,goals=db.goals.slice(0,3);let expenseCats=categories.expense.map(c=>({c,v:sums(allEntries(monthBounds(m).start,monthBounds(m).end).filter(x=>x.type==='expense'&&x.category===c)).expense})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6),max=Math.max(...expenseCats.map(x=>x.v),1);return monthBar()+`<section class="heroDash"><div><div class="eyebrow">MEU ASSISTENTE</div><h2>Seu dinheiro, sob controle.</h2><p>Veja o que já aconteceu, o que está pendente e onde seu mês deve terminar.</p></div><div class="forecastBox"><span>Saldo previsto</span><strong class="${f.saldoPrevisto>=0?'green':'red'}">${money(f.saldoPrevisto)}</strong><small>${Math.round(progress)}% do mês percorrido</small><div class="progress"><i style="width:${Math.min(progress,100)}%"></i></div></div></section><div class="cards">${[['Saldo atual',f.saldoAtual,f.saldoAtual>=0?'green':'red'],['Receitas pagas',f.actual.income,'green'],['Despesas pagas',f.actual.expense,'red'],['A pagar',f.future.expense+f.future.debt,'orange'],['Saldo previsto',f.saldoPrevisto,f.saldoPrevisto>=0?'green':'red']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[2]}">${money(x[1])}</div></div>`).join('')}</div><div class="layout"><section class="panel"><h3>📅 Próximos pagamentos</h3>${payments.length?payments.slice(0,7).map(x=>`<div class="row"><div class="rowleft"><b>${dateBR(x.date)} · ${esc(x.desc)}</b><span class="tag">${esc(x.category)}</span><span class="status ${statusOf(x)}">${statusLabel(x)}</span></div><b class="red">${money(x.amount)}</b></div>`).join(''):'<div class="empty">Nenhum pagamento pendente neste mês.</div>'}</section><section class="panel"><h3>🔔 Alertas do mês</h3>${alerts.slice(0,4).map(a=>`<div class="alert ${a.level}"><b>${a.title}</b><div>${a.text}</div></div>`).join('')||'<div class="empty">Tudo tranquilo por aqui.</div>'}<button class="btn" onclick="view='alerts';render()">Ver central de alertas</button></section></div><div class="layout"><section class="panel"><h3>🎯 Metas financeiras</h3>${goals.length?goals.map(g=>{let p=Math.min(Number(g.current||0)/Math.max(Number(g.target||1),1)*100,100);return `<div class="budgettop"><span>${esc(g.name)}</span><span>${Math.round(p)}%</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="small">${money(g.current)} de ${money(g.target)}</div>`}).join(''):'<div class="empty">Crie sua primeira meta.</div>'}<button class="btn primary" style="margin-top:12px" onclick="view='goals';render()">Gerenciar metas</button></section><section class="panel"><h3>📊 Despesas por categoria</h3>${expenseCats.length?expenseCats.map(x=>`<div class="barline"><span class="small">${esc(x.c)}</span><div class="track"><div class="fill" style="width:${x.v/max*100}%"></div></div><b>${money(x.v)}</b></div>`).join(''):'<div class="empty">Registre despesas para ver sua distribuição.</div>'}</section></div>`}
function categoryOptions(type,selected=''){return (categories[type]||[]).map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function entries(){let m=ym(cursor),b=monthBounds(m),items=allEntries(b.start,b.end).filter(x=>x.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));return monthBar()+`<div class="layout"><section class="panel"><h3>${editingId?'Editar lançamento':'Novo lançamento'}</h3><form class="formgrid" onsubmit="submitEntry(event)"><div class="field"><label>Tipo</label><select id="etype" onchange="refreshCategory()"><option value="income">Receita</option><option value="expense">Despesa</option><option value="investment">Investimento</option></select></div><div class="field"><label>Categoria</label><select id="ecat"></select></div><div class="field full"><label>Descrição</label><input id="edesc" required placeholder="Ex.: almoço, salário, internet..."></div><div class="field"><label>Valor</label><input id="eamount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>Data</label><input id="edate" type="date" value="${todayISO()}" required></div><div class="field"><label>Status</label><select id="estatus"><option value="paid">Pago / recebido</option><option value="pending">Pendente / agendado</option></select></div><div class="field full"><label>Observação</label><textarea id="enote"></textarea></div><div class="formactions"><button type="button" class="btn" onclick="cancelEdit()">Limpar</button><button class="btn primary">${editingId?'Salvar alterações':'Adicionar lançamento'}</button></div></form></section><section class="panel"><h3>Calendário financeiro</h3>${calendar(cursor)}</section></div><section class="panel" style="margin-top:16px"><div class="row"><h3 style="margin:0">Lançamentos de ${monthLabel(cursor)}</h3><span class="small">${items.length} item(ns)</span></div>${items.length?items.map(x=>`<div class="row"><div class="rowleft"><b>${dateBR(x.date)} · ${labels[x.type]} · ${esc(x.desc)}</b><span class="tag">${esc(x.category)}${x.auto?' • automático':''}</span><span class="status ${statusOf(x)}">${statusLabel(x)}</span></div><div style="text-align:right"><b class="${x.type==='income'?'green':x.type==='investment'?'blue':'red'}">${money(x.amount)}</b><div class="actions" style="justify-content:flex-end;margin-top:5px">${!isPaid(x)?`<button class="btn sm" onclick="markPaid('${x.id}')">Marcar pago</button>`:''}${x.auto?'<span class="small">projeção</span>':`<button class="btn sm" onclick="editEntry('${x.id}')">Editar</button><button class="btn sm danger" onclick="delEntry('${x.id}')">Excluir</button>`}</div></div></div>`).join(''):'<div class="empty">Nenhum lançamento neste mês.</div>'}</section>`}
function calendar(d){let y=d.getFullYear(),mo=d.getMonth(),first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate(),start=(first.getDay()+6)%7,cells=[];let prev=new Date(y,mo,0).getDate();for(let i=0;i<start;i++)cells.push(`<div class="day mutedday"><div class="daynum">${prev-start+i+1}</div></div>`);for(let day=1;day<=days;day++){let date=`${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,ev=allEntries(`${date}`,`${date}`).slice(0,3),today=todayISO()===date;cells.push(`<div class="day ${today?'today':''}"><div class="daynum">${day}</div>${ev.map(x=>`<div class="event ${x.type==='expense'?'exp':x.type==='investment'?'inv':x.type==='debt'?'debt':''}" title="${esc(x.desc)}">${x.type==='income'?'+':'−'} ${money(x.amount).replace('R$','').trim()} ${!isPaid(x)?'•':''}</div>`).join('')}</div>`)}while(cells.length%7)cells.push('<div class="day mutedday"></div>');return `<div class="calendar">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div>`}
function submitEntry(e){e.preventDefault();let obj={type:etype.value,category:ecat.value,desc:edesc.value.trim(),amount:Number(eamount.value),date:edate.value,note:enote.value,status:estatus.value};if(editingId){let i=db.entries.findIndex(x=>x.id===editingId);if(i>=0)db.entries[i]={...db.entries[i],...obj};editingId=null}else db.entries.push({id:Date.now().toString(),...obj});save();render()}
function editEntry(id){let x=db.entries.find(x=>x.id===id);if(!x)return;editingId=id;view='entries';render();setTimeout(()=>{etype.value=x.type;refreshCategory(x.category);edesc.value=x.desc;eamount.value=x.amount;edate.value=x.date;enote.value=x.note||'';estatus.value=isPaid(x)?'paid':'pending'},0)}function cancelEdit(){editingId=null;render()}function delEntry(id){if(confirm('Excluir este lançamento?')){db.entries=db.entries.filter(x=>x.id!==id);save();render()}}
function markPaid(id){let d=db.debts.find(d=>id.startsWith(d.id+'-'));if(d){let n=Number(id.split('-').pop())+1;d.paidInstallments=d.paidInstallments||[];if(!d.paidInstallments.includes(n))d.paidInstallments.push(n);save();render();return}let r=db.recurring.find(r=>id.startsWith(r.id+'@'));if(r){alert('Esta é uma projeção recorrente. Para marcar como recebida/paga, registre o lançamento real em Lançamentos.');return}let x=db.entries.find(x=>x.id===id);if(x){x.status='paid';save();render()}}

function debts(){return `<div class="layout"><section class="panel"><h3>🛍️ Nova compra parcelada</h3><div class="notice">A primeira parcela não é considerada paga automaticamente. Informe o primeiro vencimento e as demais serão projetadas mês a mês.</div><form class="formgrid" onsubmit="addDebt(event)" style="margin-top:12px"><div class="field full"><label>Descrição</label><input id="dname" required placeholder="Ex.: TV, celular, financiamento..."></div><div class="field"><label>Valor total</label><input id="dtotal" type="number" step="0.01" required></div><div class="field"><label>Valor da parcela</label><input id="dinst" type="number" step="0.01" required></div><div class="field"><label>Número de parcelas</label><input id="dqty" type="number" min="1" max="120" required></div><div class="field"><label>Primeiro vencimento</label><input id="dstart" type="date" required></div><div class="formactions"><button class="btn primary">Cadastrar parcelamento</button></div></form></section><section class="panel"><h3>Parcelamentos ativos</h3>${db.debts.length?db.debts.map(debtCard).join(''):'<div class="empty">Nenhuma compra parcelada.</div>'}</section></div>`}
function addDebt(e){e.preventDefault();let s=new Date(dstart.value+'T12:00:00'),qty=Number(dqty.value),end=new Date(s);end.setMonth(end.getMonth()+qty-1);db.debts.push({id:Date.now().toString(),name:dname.value,total:Number(dtotal.value),installment:Number(dinst.value),installments:qty,start:dstart.value,end:end.toISOString().slice(0,10),paidInstallments:[]});save();render()}
function debtCard(d){let paid=(d.paidInstallments||[]).length,pct=paid/d.installments*100;return `<div class="debtcard"><div class="row"><div><b>${esc(d.name)}</b><div class="small">${money(d.installment)} × ${d.installments} • total ${money(d.total)}</div></div><button class="btn sm danger" onclick="delDebt('${d.id}')">Excluir</button></div><div class="progress"><i style="width:${pct}%"></i></div><div class="debtmeta"><span>${paid}/${d.installments} pagas</span><span>${Math.round(pct)}%</span></div><div class="debtmeta" style="margin-top:7px"><span>1ª: ${dateBR(d.start)}</span><span>Última: ${dateBR(d.end)}</span></div></div>`}function delDebt(id){if(confirm('Excluir este parcelamento?')){db.debts=db.debts.filter(x=>x.id!==id);save();render()}}
function recurring(){return `<div class="layout"><section class="panel"><h3>🔁 Nova recorrência</h3><form class="formgrid" onsubmit="saveRecurring(event)"><div class="field"><label>Tipo</label><select id="rtype" onchange="refreshRCategory()"><option value="income">Receita</option><option value="expense">Despesa</option><option value="investment">Investimento</option></select></div><div class="field"><label>Categoria</label><select id="rcat"></select></div><div class="field full"><label>Descrição</label><input id="rdesc" required placeholder="Ex.: salário, aluguel, internet..."></div><div class="field"><label>Valor</label><input id="ramount" type="number" step="0.01" min="0.01" required></div><div class="field"><label>Primeira data</label><input id="rstart" type="date" value="${todayISO()}" required></div><div class="field"><label>Frequência</label><select id="rfreq"><option value="monthly">Mensal</option><option value="weekly">Semanal</option><option value="yearly">Anual</option></select></div><div class="field"><label>Fim (opcional)</label><input id="rend" type="date"></div><div class="field full"><label>Observação</label><input id="rnote"></div><div class="formactions"><button class="btn primary">Criar recorrência</button></div></form></section><section class="panel"><h3>Recorrências ativas</h3>${db.recurring.length?db.recurring.map(r=>`<div class="debtcard"><div class="row"><div><b>${esc(r.desc)}</b><div class="small">${labels[r.type]} • ${esc(r.category)} • ${r.frequency==='monthly'?'Mensal':r.frequency==='weekly'?'Semanal':'Anual'}</div></div><div class="actions"><button class="btn sm" onclick="toggleRecurring('${r.id}')">${r.active===false?'Ativar':'Pausar'}</button><button class="btn sm danger" onclick="delRecurring('${r.id}')">Excluir</button></div></div><div class="debtmeta"><span>${money(r.amount)} • início ${dateBR(r.start)}</span><span>${r.end?'até '+dateBR(r.end):'sem fim'}</span></div></div>`).join(''):'<div class="empty">Nenhuma recorrência.</div>'}</section></div>`}function refreshRCategory(){let x=document.getElementById('rcat');if(x)x.innerHTML=categoryOptions(rtype.value)}function saveRecurring(e){e.preventDefault();db.recurring.push({id:Date.now().toString(),type:rtype.value,category:rcat.value,desc:rdesc.value,amount:Number(ramount.value),start:rstart.value,end:rend.value||'',frequency:rfreq.value,note:rnote.value,active:true});save();render()}function toggleRecurring(id){let r=db.recurring.find(x=>x.id===id);if(r)r.active=r.active===false;save();render()}function delRecurring(id){if(confirm('Excluir esta recorrência?')){db.recurring=db.recurring.filter(x=>x.id!==id);save();render()}}
function budgets(){let m=ym(cursor),items=allEntries(monthBounds(m).start,monthBounds(m).end).filter(x=>x.type==='expense');return monthBar()+`<div class="layout"><section class="panel"><h3>Definir orçamento</h3><form class="formgrid" onsubmit="saveBudget(event)"><div class="field"><label>Categoria</label><select id="bcat">${categoryOptions('expense')}</select></div><div class="field"><label>Limite mensal</label><input id="blimit" type="number" step="0.01" required></div><div class="formactions"><button class="btn primary">Salvar orçamento</button></div></form></section><section class="panel"><h3>Resumo</h3><div class="statbox"><div class="small">Despesas pagas</div><div class="big red">${money(sums(items).expense)}</div></div></section></div><section class="panel" style="margin-top:16px"><h3>Orçamentos de ${monthLabel(cursor)}</h3>${categories.expense.map(c=>{let spent=sums(items.filter(x=>x.category===c)).expense,limit=Number(db.budgets[m+'|'+c]||0);if(!limit&&!spent)return '';let p=limit?Math.min(spent/limit*100,100):0;return `<div style="margin:14px 0"><div class="budgettop"><span>${esc(c)}</span><span>${money(spent)} / ${limit?money(limit):'sem limite'}</span></div><div class="progress"><i style="width:${p}%;background:${spent>limit&&limit?'var(--red)':'var(--p)'}"></i></div><div class="small">${limit?(spent>limit?'⚠️ ultrapassado':Math.round(p)+'% utilizado'):''} <button class="btn sm" onclick="removeBudget('${esc(c)}')">Remover</button></div></div>`}).join('')||'<div class="empty">Nenhum orçamento configurado.</div>'}</section>`}function saveBudget(e){e.preventDefault();db.budgets[ym(cursor)+'|'+bcat.value]=Number(blimit.value);save();render()}function removeBudget(c){delete db.budgets[ym(cursor)+'|'+c];save();render()}
function assets(){let total=db.assets.reduce((a,x)=>a+Number(x.amount),0);return `<div class="cards"><div class="card"><div class="label">Patrimônio total</div><div class="value green">${money(total)}</div></div><div class="card"><div class="label">Ativos</div><div class="value">${db.assets.length}</div></div></div><div class="layout"><section class="panel"><h3>Novo patrimônio</h3><form class="formgrid" onsubmit="addAsset(event)"><div class="field full"><label>Nome</label><input id="aname" required placeholder="Ex.: veículo, reserva, imóvel"></div><div class="field"><label>Tipo</label><select id="atype"><option>Dinheiro</option><option>Investimento</option><option>Veículo</option><option>Imóvel</option><option>Outros bens</option></select></div><div class="field"><label>Valor atual</label><input id="aamount" type="number" step="0.01" min="0" required></div><div class="formactions"><button class="btn primary">Adicionar</button></div></form></section><section class="panel"><h3>Meus ativos</h3>${db.assets.length?db.assets.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="tag">${esc(x.type)}</div></div><div><b class="green">${money(x.amount)}</b><button class="btn sm danger" onclick="delAsset('${x.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum ativo cadastrado.</div>'}</section></div>`}function addAsset(e){e.preventDefault();db.assets.push({id:Date.now().toString(),name:aname.value,type:atype.value,amount:Number(aamount.value)});save();render()}function delAsset(id){db.assets=db.assets.filter(x=>x.id!==id);save();render()}
function goals(){return `<div class="monthbar"><div><h1>Metas financeiras</h1><div class="sub">Transforme intenção em acompanhamento.</div></div></div><section class="panel"><h3>${editingGoalId?'Editar meta':'Nova meta'}</h3><form class="formgrid" onsubmit="saveGoal(event)"><div class="field full"><label>Nome</label><input id="gname" required placeholder="Ex.: Reserva de emergência"></div><div class="field"><label>Objetivo</label><input id="gtarget" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Valor atual</label><input id="gcurrent" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>Prazo</label><input id="gdate" type="date"></div><div class="formactions"><button class="btn primary">${editingGoalId?'Salvar':'Criar meta'}</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Minhas metas</h3>${db.goals.length?db.goals.map(g=>{let p=Math.min(g.current/g.target*100,100);return `<div class="debtcard"><div class="row"><div><b>${esc(g.name)}</b><div class="small">${g.date?'Prazo '+dateBR(g.date):'Sem prazo'}</div></div><div class="actions"><button class="btn sm" onclick="editGoal('${g.id}')">Editar</button><button class="btn sm danger" onclick="delGoal('${g.id}')">Excluir</button></div></div><div class="progress"><i style="width:${p}%"></i></div><div class="debtmeta"><span>${money(g.current)} de ${money(g.target)}</span><span>${Math.round(p)}%</span></div></div>`}).join(''):'<div class="empty">Nenhuma meta criada.</div>'}</section>`}function saveGoal(e){e.preventDefault();let o={name:gname.value,target:Number(gtarget.value),current:Number(gcurrent.value),date:gdate.value};if(editingGoalId){let i=db.goals.findIndex(x=>x.id===editingGoalId);db.goals[i]={...db.goals[i],...o};editingGoalId=null}else db.goals.push({id:Date.now().toString(),...o});save();render()}function editGoal(id){let g=db.goals.find(x=>x.id===id);if(!g)return;editingGoalId=id;render();setTimeout(()=>{gname.value=g.name;gtarget.value=g.target;gcurrent.value=g.current;gdate.value=g.date||''},0)}function delGoal(id){if(confirm('Excluir esta meta?')){db.goals=db.goals.filter(x=>x.id!==id);save();render()}}
function annual(){let y=cursor.getFullYear(),rows=Array.from({length:12},(_,i)=>{let m=y+'-'+String(i+1).padStart(2,'0'),b=monthBounds(m),s=sums(allEntries(b.start,b.end));return {m:new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(new Date(y,i,1)).replace('.',''),income:s.income,out:s.expense+s.debt+s.investment,saldo:s.income-s.expense-s.debt-s.investment}}),ti=rows.reduce((a,r)=>a+r.income,0),to=rows.reduce((a,r)=>a+r.out,0);return `<div class="monthbar"><div><h1>Visão anual</h1><div class="sub">Acompanhe o ano inteiro em uma única tela.</div></div></div><div class="cards"><div class="card"><div class="label">Receitas pagas</div><div class="value green">${money(ti)}</div></div><div class="card"><div class="label">Saídas pagas</div><div class="value red">${money(to)}</div></div><div class="card"><div class="label">Resultado</div><div class="value ${ti-to>=0?'green':'red'}">${money(ti-to)}</div></div></div><section class="panel" style="margin-top:16px"><div class="reportrow"><b>Mês</b><b>Receitas</b><b>Saídas</b><b>Saldo</b></div>${rows.map(r=>`<div class="reportrow"><span>${r.m}</span><span class="green">${money(r.income)}</span><span class="red">${money(r.out)}</span><b class="${r.saldo>=0?'green':'red'}">${money(r.saldo)}</b></div>`).join('')}</section>`}
function reports(){let y=cursor.getFullYear(),rows=Array.from({length:12},(_,i)=>{let m=y+'-'+String(i+1).padStart(2,'0'),b=monthBounds(m),s=sums(allEntries(b.start,b.end)),p=plannedSums(allEntries(b.start,b.end));return {m:new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(new Date(y,i,1)),income:s.income,expense:s.expense+s.debt+s.investment,pending:p.expense+p.debt+p.investment,saldo:s.income-s.expense-s.debt-s.investment}});return `<div class="monthbar"><div><h1>Relatórios</h1><div class="sub">Transforme seus registros em decisões.</div></div><div class="actions"><button class="btn" onclick="exportCSV()">Exportar CSV</button><button class="btn primary" onclick="window.print()">Imprimir</button></div></div><section class="panel"><div class="reportrow"><b>Mês</b><b>Receitas</b><b>Saídas</b><b>Saldo</b></div>${rows.map(r=>`<div class="reportrow"><span>${r.m}</span><span class="green">${money(r.income)}</span><span class="red">${money(r.expense)}</span><b class="${r.saldo>=0?'green':'red'}">${money(r.saldo)}</b></div>`).join('')}</section><section class="panel" style="margin-top:16px"><div class="notice">O relatório diferencia o que já foi pago do que ainda está pendente. Isso evita transformar uma compra futura em gasto realizado.</div></section>`}
function exportCSV(){let rows=[['Data','Tipo','Categoria','Descrição','Valor','Status']];allEntries().forEach(x=>rows.push([x.date,labels[x.type]||x.type,x.category,x.desc,x.amount,statusLabel(x)]));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='meu-assistente-lancamentos.csv';a.click()}
function alerts(){let arr=alertData(ym(cursor));return monthBar()+`<section class="panel"><div class="row"><h3 style="margin:0">Central de alertas</h3><span class="tag">${arr.length}</span></div>${arr.length?arr.map(a=>`<div class="alert ${a.level}"><b>${a.title}</b><div>${a.text}</div></div>`).join(''):'<div class="empty">🎉 Nenhum alerta para este mês.</div>'}</section>`}
function profile(){let p=db.profile;return `<div class="monthbar"><div><h1>Meu perfil</h1><div class="sub">Dados e preferências da sua conta.</div></div></div><div class="layout"><section class="panel"><h3>Dados pessoais</h3><form class="formgrid" onsubmit="saveProfile(event)"><div class="field"><label>Nome</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>Avatar</label><select id="pavatar"><option>🙂</option><option>😎</option><option>🚀</option><option>💰</option><option>🎯</option><option>⭐</option></select></div><div class="field"><label>Renda mensal</label><input id="pincome" type="number" step="0.01" value="${p.monthlyIncome||0}"></div><div class="formactions"><button class="btn primary">Salvar perfil</button></div></form></section><section class="panel"><h3>Conta</h3><div class="row"><span>E-mail</span><b>${esc(user.email)}</b></div><div class="row"><span>Armazenamento</span><b>Local neste aparelho</b></div><div class="row"><span>Versão</span><b>1.1</b></div><button class="btn logout" style="margin-top:12px" onclick="logout()">Sair da conta</button><div class="notice" style="margin-top:12px">O cadastro já está separado do app. Nesta fase, autenticação e dados são locais. Na etapa comercial, conectaremos Supabase para sincronização e recuperação real por e-mail.</div></section></div>`}function saveProfile(e){e.preventDefault();db.profile={...db.profile,name:pname.value,avatar:pavatar.value,monthlyIncome:Number(pincome.value||0),onboarded:true};save();render()}function logout(){localStorage.removeItem(AUTH);localStorage.removeItem('ma_current_user');location.href='/login.html'}
function showReceipt(x){let m=document.getElementById('modal');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="row"><h3 style="margin:0">${esc(x.title)}</h3><button class="btn" onclick="closeModal()">×</button></div><div class="receipt"><b>${esc(x.desc)}</b><div class="small">${esc(x.category)} • ${dateBR(x.date)}</div><div style="font-size:25px;font-weight:900;margin-top:7px">${money(x.amount)}</div><span class="status ${x.status==='paid'?'paid':'pending'}">${x.status==='paid'?'Pago':'Pendente'}</span></div><div class="notice" style="margin-top:12px">Registro salvo. Você pode desfazer agora ou editar o lançamento.</div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn danger" onclick="undoEntry('${x.id}');closeModal()">Desfazer</button><button class="btn primary" onclick="closeModal();view='entries';editEntry('${x.id}')">Editar</button><button class="btn" onclick="closeModal()">Fechar</button></div></div>`}function closeModal(){let m=document.getElementById('modal');m.className='hidden';m.innerHTML=''}function undoEntry(id){db.entries=db.entries.filter(x=>x.id!==id);save();render()}
function normalizeMoneyToken(raw){if(raw==null)return 0;let v=String(raw).trim().replace(/\s/g,'').replace(/^R\$/i,'');if(v.includes(','))return Number(v.replace(/\./g,'').replace(',','.'))||0;if(/^\d+\.\d{3}$/.test(v))return Number(v.replace('.',''))||0;return Number(v)||0}
function moneyFromText(text){let t=String(text||''),re=/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[\.,]\d{1,2})?)/gi,m,c=[];while((m=re.exec(t))){let before=t.slice(Math.max(0,m.index-1),m.index),after=t.slice(m.index+m[0].length,m.index+m[0].length+8);if(/\d/.test(before)||/^\s*x\b/i.test(after)||/^\s*vezes\b/i.test(after))continue;c.push({raw:m[1],index:m.index})}if(!c.length)return 0;let rs=c.find(x=>/R\$\s*$/i.test(t.slice(Math.max(0,x.index-4),x.index)));return normalizeMoneyToken((rs||c[0]).raw)}
function cleanDesc(text,type){let d=String(text).trim().replace(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[\.,]\d{1,2})?)/gi,' ').replace(/\b\d+\s*x\b/gi,' ');if(type==='income')d=d.replace(/^(?:eu\s+)?(?:recebi|entrou|ganhei|vendi|venda|receita|renda|sal[aá]rio|pagamento)\b/iu,' ');else d=d.replace(/^(?:eu\s+)?(?:gastei|paguei|comprei|vou pagar|pagar|despesa)\b/iu,' ');return d.replace(/\b(?:de|da|do|em|na|no|por|para|uma|um|dia|primeira|parcela)\b/gi,' ').replace(/\s+/g,' ').trim()}
function detectCategory(text,type){let t=text.toLowerCase();if(type==='income'){if(/sal[aá]rio/.test(t))return'Salário';if(/freel/.test(t))return'Freelance';if(/uber|99|corrida/.test(t))return'Uber/99';if(/vend/.test(t))return'Vendas';if(/benef/.test(t))return'Benefícios';if(/aluguel/.test(t))return'Aluguéis recebidos';return'Outras receitas'}if(/mercado|supermercado|feira|padaria|restaurante|almoco|almoço|jantar|comida|lanche/.test(t))return'Alimentação';if(/gasolina|combustivel|combustível|etanol|álcool|alcool|gnv|posto/.test(t))return'Transporte';if(/farmacia|farmácia|medico|médico|consulta|exame|dentista|saude|saúde/.test(t))return'Saúde';if(/aluguel|condominio|condomínio|prestacao da casa/.test(t))return'Moradia';if(/luz|energia|agua|água|internet|telefone|celular|conta|boleto|fatura|iptu|taxa/.test(t))return'Contas';if(/escola|curso|faculdade|mensalidade escolar/.test(t))return'Educação';if(/imposto|ipva|licenciamento|multa/.test(t))return'Impostos';if(/academia|netflix|spotify|prime|assinatura/.test(t))return/academia/.test(t)?'Saúde':'Assinaturas';if(/cinema|jogo|viagem|bar|festa|lazer/.test(t))return'Lazer';if(/roupa|sapato|celular|eletronico|eletrônico|compra/.test(t))return'Compras';if(/familia|família|filho|filha|esposa|esposo/.test(t))return'Família';return'Outras despesas'}
function parseDate(text){let raw=String(text||'').toLowerCase(),now=new Date(),day=null,month=null,year=null,months=['janeiro','fevereiro','março','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];let m=raw.match(/(?:dia|em|para|primeira parcela(?:\s*(?:é|e)?\s*(?:dia|em|para)?))\s*(\d{1,2})(?:\s*(?:de|\/|-)\s*(janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro|\d{1,2}))?(?:\s*(?:de|\/|-)\s*(\d{4}))?/i);if(m){day=Number(m[1]);if(m[2])month=/^\d+$/.test(m[2])?Number(m[2])-1:months.indexOf(m[2]);if(m[3])year=Number(m[3])}if(day==null){m=raw.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);if(m){day=Number(m[1]);month=Number(m[2])-1;if(m[3])year=Number(m[3])}}if(day==null)return null;if(month==null)month=now.getMonth();if(year==null)year=now.getFullYear();let d=new Date(year,month,day,12);if(d.getDate()!==day||d.getMonth()!==month)return null;if(!m?.[3]&&d<new Date(now.getFullYear(),now.getMonth(),now.getDate(),0))d.setFullYear(d.getFullYear()+1);return d.toISOString().slice(0,10)}
function addAssistantEntry(type,amount,text,status='paid',date=todayISO()){let category=detectCategory(text,type),desc=cleanDesc(text,type)||category,id=Date.now().toString();db.entries.push({id,type,category,desc,amount,date,status,note:'Registrado pelo Meu Assistente'});save();showReceipt({title:type==='income'?'Receita registrada':'Despesa registrada',id,desc,amount,category,date,status});return{id,type,category,desc,amount,date,status}}
function createAssistantDebt(qty,val,description,start){let s=new Date(start+'T12:00:00'),end=new Date(s);end.setMonth(end.getMonth()+qty-1);db.debts.push({id:Date.now().toString(),name:description,total:qty*val,installment:val,installments:qty,start,end:end.toISOString().slice(0,10),paidInstallments:[]});db.assistantPending=null;save()}
function assistantReply(text){let raw=String(text||'').trim(),t=raw.toLowerCase(),amount=moneyFromText(raw);if(!raw)return'Diga algo como “gastei 60 no almoço” ou “recebi 500 de uma venda”.';if(/quanto.*(gastei|despesa|saiu)|resumo.*m[eê]s|saldo.*m[eê]s/.test(t)){let f=forecast(ym(cursor));return`Neste mês: receitas pagas <b>${money(f.actual.income)}</b>, despesas pagas <b>${money(f.actual.expense+f.actual.debt)}</b>. Seu saldo atual é <b>${money(f.saldoAtual)}</b> e o saldo previsto é <b>${money(f.saldoPrevisto)}</b>.`};if(/(contas?|pagamentos?|parcelas?).*(pagar|vencer)|o que.*pagar|a pagar/.test(t)){let b=upcomingPayments(ym(cursor)).slice(0,7);return b.length?'<b>Próximos pagamentos:</b><br>'+b.map(x=>`• ${dateBR(x.date)} — ${esc(x.desc)}: <b>${money(x.amount)}</b> <span class="small">(${statusLabel(x)})</span>`).join('<br>'):'Você não tem pagamentos pendentes neste mês. ✅'}
if(db.assistantPending?.kind==='installment'){let start=parseDate(raw);if(start){let p=db.assistantPending;createAssistantDebt(p.qty,p.val,p.description,start);return`✅ Compra cadastrada em <b>${p.qty} parcelas de ${money(p.val)}</b>.<br>📅 Primeira parcela: <b>${dateBR(start)}</b>.<br>Nenhuma parcela foi considerada paga hoje.`}}
let parcel=raw.match(/(?:em\s*)?(\d{1,3})\s*x\s*(?:de\s*)?(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[\.,]\d{1,2})?)/i);if(parcel){let qty=Number(parcel[1]),val=normalizeMoneyToken(parcel[2]);if(qty>0&&qty<=120&&val>0){let start=parseDate(raw),description=cleanDesc(raw,'expense')||'Compra parcelada';if(!start){db.assistantPending={kind:'installment',qty,val,description,createdAt:Date.now()};save();return`🔁 Entendi <b>${qty} parcelas de ${money(val)}</b>, total de <b>${money(qty*val)}</b>.<br><br>Quando vence a <b>primeira parcela</b>?<br>Ex.: “dia 18 de outubro” ou “18/10”.`};createAssistantDebt(qty,val,description,start);return`🔁 Perfeito. Cadastrei <b>${qty} parcelas de ${money(val)}</b>.<br>📅 Primeira parcela: <b>${dateBR(start)}</b>.<br>Nenhuma foi marcada como paga hoje.`}}
if(/todo m[eê]s|mensal|cada m[eê]s|recorrente|semanal|toda semana|anual|todo ano/.test(t)&&amount){let frequency=/semanal|toda semana/.test(t)?'weekly':/anual|todo ano/.test(t)?'yearly':'monthly',type=/(recebi|entra|ganho|sal[aá]rio|venda|receita)/.test(t)?'income':'expense',desc=cleanDesc(raw,type)||detectCategory(raw,type);db.recurring.push({id:Date.now().toString(),type,category:detectCategory(raw,type),desc,amount,start:todayISO(),end:'',frequency,note:'Criada pelo Meu Assistente',active:true});save();return`🔁 Criei uma recorrência <b>${frequency==='monthly'?'mensal':frequency==='weekly'?'semanal':'anual'}</b> de <b>${money(amount)}</b> para ${esc(desc)}.`}
let futureDate=parseDate(raw);let isFuture=/vou pagar|irei pagar|vou quitar|irei quitar|vai vencer|vence|agendei|agendar|programar|programado|amanhã|amanha|depois/.test(t)&&futureDate;if(/\b(recebi|entrou|ganhei|vendi|venda|receita|renda|sal[aá]rio|pagamento recebido|caiu na conta)\b/.test(t)&&amount){let e=addAssistantEntry('income',amount,raw,'paid');return`✅ Registrei <b>${money(e.amount)}</b> como receita em <b>${esc(e.category)}</b>.`};if(/\b(gastei|paguei|comprei|despesa|despesei)\b/.test(t)&&amount){let e=addAssistantEntry('expense',amount,raw,isFuture?'pending':'paid',isFuture?futureDate:todayISO());return isFuture?`📅 Agendei <b>${money(e.amount)}</b> para <b>${dateBR(e.date)}</b>. Não saiu do saldo atual.`:`✅ Registrei <b>${money(e.amount)}</b> como despesa paga em <b>${esc(e.category)}</b>.`};return`Posso registrar isso para você. Experimente:<br>• “Comprei um almoço de 60”<br>• “Vou pagar 90 de internet dia 20”<br>• “Recebi 500 de uma venda”<br>• “Comprei uma TV em 10x de 350”`}
function addChat(role,text,html){db.chat.push({role,text,html});db.chat=db.chat.slice(-40);save()}function assistantPanel(){return`<div id="assistantPanel" class="assistant-panel"><div class="assistant-head"><div class="row" style="padding:0;border:0"><div><h3>✨ Meu Assistente</h3><small>Seu dinheiro organizado em uma conversa.</small></div><button class="btn" onclick="toggleAssistant()">×</button></div></div><div class="assistant-body"><div class="quick"><button onclick="assistantQuick('Comprei um almoço de 60')">Almoço R$60</button><button onclick="assistantQuick('Recebi 500 de uma venda')">Recebi R$500</button><button onclick="assistantQuick('Quanto gastei este mês?')">Resumo</button><button onclick="assistantQuick('Quais pagamentos tenho a pagar?')">A pagar</button></div><div id="chatbox" class="chatbox">${db.chat.length?db.chat.slice(-12).map(m=>`<div class="bubble ${m.role}">${m.html||esc(m.text)}</div>`).join(''):'<div class="bubble ai"><b>Olá! 👋 Sou o seu Meu Assistente.</b><br><span class="small">Você não precisa procurar menus. É só me dizer o que aconteceu com seu dinheiro que eu organizo para você.</span><br><br>Experimente:<br>• “Comprei um almoço de R$ 60”<br>• “Recebi R$ 500 de uma venda”<br>• “Vou pagar a internet dia 20”<br>• “Comprei uma TV em 10x de R$ 350, primeira parcela dia 18”</div>'}</div><div class="assistant-input"><input id="assistantInput" placeholder="Ex.: gastei 32 no almoço" onkeydown="if(event.key==='Enter')sendAssistant()"><button class="btn primary" onclick="sendAssistant()">Enviar</button></div></div></div>`}function toggleAssistant(){let x=document.getElementById('assistantPanel');if(x){x.remove();return}let d=document.createElement('div');d.innerHTML=assistantPanel();document.body.appendChild(d.firstElementChild);setTimeout(()=>{let c=document.getElementById('chatbox');if(c)c.scrollTop=c.scrollHeight},20)}function assistantQuick(t){let i=document.getElementById('assistantInput');if(i){i.value=t;sendAssistant()}}function sendAssistant(){let i=document.getElementById('assistantInput');if(!i||!i.value.trim())return;let t=i.value.trim();addChat('user',t);let r=assistantReply(t);addChat('ai',r,r);render()}
function onboarding(){let wrap=document.createElement('div');wrap.className='onboarding';let step=0,d={...db.profile};function draw(){let c=step===0?`<div class="onbrand"><img src="/assets/icon.svg"><span>Meu</span> Assistente</div><h1>Vamos deixar seu dinheiro mais organizado.</h1><p>Você não precisa aprender planilhas. O Meu Assistente vai transformar seus registros em uma visão simples do seu mês.</p><div class="notice">🔒 Nesta fase de testes, os dados ficam somente neste navegador.</div>`:step===1?`<div class="onbrand">👋 Prazer, ${esc(d.name||'')}</div><h1>Como você quer ser chamado?</h1><div class="field"><label>Nome</label><input id="obname" value="${esc(d.name||'')}" placeholder="Seu nome"></div><div class="field"><label>Renda mensal aproximada</label><input id="obincome" type="number" step="0.01" value="${d.monthlyIncome||''}"></div>`:`<div class="onbrand">🎯 Seu primeiro objetivo</div><h1>O que você quer conquistar?</h1><div class="field"><label>Meta</label><input id="obgoal" placeholder="Ex.: Reserva de emergência"></div><div class="field"><label>Valor da meta (opcional)</label><input id="obtarget" type="number" step="0.01"></div>`;wrap.innerHTML=`<div class="onboardbox">${c}<div class="onboardactions"><button class="btn" id="back">${step?'Voltar':'Pular'}</button><button class="btn primary" id="next">${step<2?'Continuar':'Começar'}</button></div></div>`;document.body.appendChild(wrap);document.getElementById('back').onclick=()=>{if(step===0){db.profile.onboarded=true;save();wrap.remove();render()}else{step--;draw()}};document.getElementById('next').onclick=()=>{if(step===0){step=1;draw()}else if(step===1){d.name=document.getElementById('obname').value.trim();d.monthlyIncome=Number(document.getElementById('obincome').value||0);step=2;draw()}else{d.mainGoal=document.getElementById('obgoal').value.trim();db.profile={...db.profile,...d,onboarded:true};let target=Number(document.getElementById('obtarget').value||0);if(d.mainGoal&&target)db.goals.push({id:Date.now().toString(),name:d.mainGoal,target,current:0,date:''});save();wrap.remove();render()}}}draw()}
